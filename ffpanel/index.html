
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101116">
  <title>HackyX Gaming Panel</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header class="app-header">
    <h1>HackyX</h1>
    <p>Gaming Settings Panel</p>
  </header>

  <main>
    <section class="settings-card">
      <h2>Sensitivity Settings</h2>
      <p class="subtitle">Adjust the values to your preference.</p>

      <div id="settings"></div>

      <div class="button-group">
        <button id="saveBtn">Save Settings</button>
        <button id="resetBtn">Reset Settings</button>
      </div>
    </section>
  </main>

  <footer>
    <p>HackyX • Your personal gaming companion</p>
  </footer>

  <script src="./script.js"></script>
</body>
</html>
